<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Atlas</title><style>
:root{--navy:#112a4b;--blue:#3979f3;--mint:#25bd88;--line:#e4ebf5;--muted:#71839d}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f8ff;background-image:radial-gradient(circle at 0 0,#d7ebff,transparent 28%),radial-gradient(circle at 100% 100%,#eee1ff,transparent 24%)}.app{max-width:1030px;margin:auto;padding:22px 16px 46px}.nav,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:900}.logo{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:8px;border-radius:13px;background:linear-gradient(145deg,#213b69,#3d7df4);font-size:22px}.lang{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;font-weight:bold}.hero{min-height:220px;padding:29px;border-radius:26px;color:#fff;background:linear-gradient(105deg,#1b355f,#376dc0 60%,#6397ef),url('assets/world-explorers.png') right center/auto 116% no-repeat;background-blend-mode:normal,screen;box-shadow:0 15px 33px #25467528}.eyebrow,.kind{font-size:11px;letter-spacing:1.4px;font-weight:900;color:#c2dfff}.hero h1{margin:9px 0;font-size:clamp(29px,4vw,42px);line-height:1.12;letter-spacing:-2px;white-space:pre-line}.hero p{max-width:500px;margin:0;color:#e2efff;font-size:14px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:17px 0}.stat,.board,.hall{background:#fff;border:1px solid var(--line)}.stat{padding:14px 16px;border-radius:17px}.stat small{color:var(--muted);font-weight:bold}.stat b{display:block;margin-top:5px;font-size:21px}.purple{color:#7650d4}.board{padding:23px;border-radius:27px;box-shadow:0 15px 35px #18385e14}.row{font-size:13px;font-weight:bold;color:var(--muted)}.badge{border-radius:99px;padding:8px 11px;background:#eef4ff;color:#356ec9}.bar{height:9px;margin:14px 0 20px;border-radius:99px;overflow:hidden;background:#e8edf6}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blu uted);font-weight:bold;cursor:pointer}.next,.speak{border:0;border-radius:13px;padding:12px 17px;color:#fff;background:var(--navy);font-weight:bold;cursor:pointer}.speak{background:#4f7fe0}.hidden{visibility:hidden}.hall{margin-top:17px;padding:20px;border-radius:20px}.hall h3{margin:0 0 10px}.rank{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:14px}.rank:last-of-type{border:0}.rank b{width:28px;color:#8563d8}.rank span{margin-left:auto;font-weight:bold}.share{background:#7650d4;margin-top:12px}.empty{color:var(--muted);font-size:14px}.end{text-align:center;padding:25px}.medal{font-size:62px;animation:jump 1.5s infinite}.welcome{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:18px;background:#102747b8;backdrop-filter:blur(5px)}.welcome.hidden{display:none}.welcome-card{width:min(100%,430px);padding:30px;border-radius:25px;background:#fff;text-align:center;box-shadow:0 25px 60px #07152d55}.kid{font-size:55px;animation:jump 1.6s infinite}.welcome-card p{color:var(--muted);line-height:1.5}.welcome-card input{width:100%;margin:12px 0;padding:14px;border:2px solid var(--line);border-radius:13px;font:inherit;font-weight:bold}.welcome-card input:focus{outline:none;border-color:var(--blue)}.welcome-card .next{width:100%;background:var(--blue)}.note{text-align:center;color:#8b9bb1;font-size:11px}@keyframes wave{50%{transform:rotate(7deg)scale(1.07)}}@keyframes pulse{50%{transform:scale(1.13)}}@keyframes float{50%{transform:translateY(-9px)rotate(-4deg)}}@keyframes jump{50%{transform:translateY(-10px)scale(1.05)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:650px){.app{padding:15px 11px}.hero{min-height:200px;padding:23px;background-size:cover,auto 80%}.stats{grid-template-columns:repeat(2,1fr)}.board{padding:15px}.choices{grid-template-columns:1fr}.quiz{min-height:235px}}
</style></head><body><main class="app"><nav class="nav"><div class="brand"><span class="logo">🌍</span>WORLD ATLAS</div><div><button class="edit" id="edit">✎</button><select class="lang" id="lang"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select></div></nav><section class="hero"><div class="eyebrow" id="eye"></div><h1 id="title"></h1><p id="intro"></p></section><section class="stats"><div class="stat"><small id="lx"></small><b id="xp">0 XP</b></div><div class="stat"><small id="ls"></small><b id="streak">0</b></div><div class="stat"><small id="lb"></small><b id="best">0</b></div><div class="stat"><small id="lc"></small><b class="purple" id="cards">0 / 10,000</b></div></section><section class="board" id="game"></section><section class="hall"><h3 id="hallTitle"></h3><div id="ranking"></div><button class="next share" id="share"></button></section><p class="note" id="note"></p></main><div class="welcome" id="welcome"><div class="welcome-card"><div class="kid">🧭</div><h2 id="welcomeTitle"></h2><p id="welcomeText"></p><input id="name" maxlength="16"><button class="next" id="enter"></button></div></div><script>
const $=id=>document.getElementById(id),TOTAL=10000,RUN=12,shuffle=a=>[...a].sort(()=>Math.random()-.5);let lang=localStorage.waLang||'ko',player=localStorage.waPlayer||'',state=JSON.parse(localStorage.waState||'{"xp":0,"best":0,"cards":[],"ranks":[]}'),deck=[],turn=0,streak=0,score=0,locked=false,rankSaved=false;
const I={ko:{eye:'10,000 CARD WORLD QUEST',title:'카드 한 장으로\n세계와 친구 되기',intro:'재미있는 그림, 쉬운 힌트, 그리고 내 목소리로 세계를 탐험해요.',xp:'탐험 XP',streak:'연속 정답',best:'최고 점수',cards:'내 카드',note:'카드·XP·명예의 전당은 이 기기에 저장됩니다.',welcome:'탐험가 등록',welcomeText:'이름을 적고 친구들과 세계 여행을 시작해요!',name:'탐험가 이름',enter:'탐험 시작하기 →',edit:'이름 바꾸기',round:'장 탐험 중',card:'카드',k:['국기 카드','수도 카드','대륙 카드','명소 카드'],q:[n=>'이 국기는 어느 나라의 것일까요?',n=>`${n}의 수도는 어디일까요?`,n=>`${n}는 어느 대륙에 있을까요?`,n=>`${n}이 있는 나라는 어디일까요?`],hint:'💡 힌트',speak:'🔊 문제 읽기',next:'다음 카드 →',clue:(n,c)=>`힌트: ${n}의 수도는 ${c}입니다.`,yes:(p,f)=>`좋아요! +${p} XP · ${f}`,no:(a,f)=>`정답은 ${a} · ${f}`,hall:'🏆 우리 반 명예의 전당',empty:'아직 기록이 없어요. 첫 번째 탐험가가 되어보세요!',share:'결과 자랑하기',done:'탐험을 마쳤어요!',again:'새 탐험 시작하기 →'},en:{eye:'10,000 CARD WORLD QUEST',title:'Make friends with the world,\none card at a time',intro:'Explore with bright pictures, easy clues, and spoken questions.',xp:'Explorer XP',streak:'Answer streak',best:'Best score',cards:'My cards',note:'Cards, XP, and rankings are saved on this device.',welcome:'Explorer sign-up',welcomeText:'Type your name and start a world adventure!',name:'Explorer name',enter:'Start exploring →',edit:'Change name',round:' cards exploring',card:'Card',k:['FLAG CARD','CAPITAL CARD','CONTINENT CARD','LANDMARK CARD'],q:[n=>'Which country has this flag?',n=>`What is the capital of ${n}?`,n=>`Which continent is ${n} in?`,n=>`Which country is home to ${n}?`],hint:'💡 Clue',speak:'🔊 Read question',next:'Next card →',clue:(n,c)=>`Clue: The capital of ${n} is ${c}.`,yes:(p,f)=>`Great! +${p} XP · ${f}`,no:(a,f)=>`The answer is ${a} · ${f}`,hall:'🏆 Hall of Explorers',empty:'No scores yet. Be the first explorer!',share:'Share my result',done:'Expedition complete!',again:'New quest →'},ja:{eye:'10,000枚の世界カードクエスト',title:'カード1枚で、\n世界と友だちになろう',intro:'楽しい絵とヒント、音声の問題で世界を探検しよう。',xp:'探検 XP',streak:'連続正解',best:'最高スコア',cards:'マイカード',note:'カード・XP・ランキングはこの端末に保存されます。',welcome:'探検家登録',welcomeText:'名前を書いて世界の旅を始めよう！',name:'探検家の名前',enter:'探検を始める →',edit:'名前を変える',round:'枚を探検中',card:'カード',k:['国旗カード','首都カード','大陸カード','名所カード'],q:[n=>'この国旗はどの国のもの？',n=>`${n}の首都はどこ？`,n=>`${n}はどの大陸にある？`,n=>`${n}がある国はどこ？`],hint:'💡 ヒント',speak:'🔊 問題を読む',next:'次のカード →',clue:(n,c)=>`ヒント：${n}の首都は${c}です。`,yes:(p,f)=>`正解！ +${p} XP · ${f}`,no:(a,f)=>`正解は${a} · ${f}`,hall:'🏆 探検家の名誉の殿堂',empty:'まだ記録がありません。最初の探検家になろう！',share:'結果をシェア',done:'探検完了！',again:'新しい探検 →'},zh:{eye:'10,000张世界卡片任务',title:'一张卡片，\n认识一个世界朋友',intro:'用有趣的图画、简单提示和语音问题探索世界。',xp:'探索 XP',streak:'连续答对',best:'最高分',cards:'我的卡片',note:'卡片、XP 和排行榜保存在此设备上。',welcome:'探险家登记',welcomeText:'写下名字，开始环游世界吧！',name:'探险家名字',enter:'开始探索 →',edit:'更改名字',round:'张卡片探索中',card:'卡片',k:['国旗卡','首都卡','大洲卡','名胜卡'],q:[n=>'这面国旗属于哪个国家？',n=>`${n}的首都在哪里？`,n=>`${n}在哪个大洲？`,n=>`${n}在哪个国家？`],hint:'💡 提示',speak:'🔊 朗读问题',next:'下一张卡 →',clue:(n,c)=>`提示：${n}的首都是${c}。`,yes:(p,f)=>`太棒了！+${p} XP · ${f}`,no:(a,f)=>`答案是${a} · ${f}`,hall:'🏆 探险家荣誉榜',empty:'还没有记录。成为第一位探险家吧！',share:'分享我的成绩',done:'探索完成！',again:'开始新的探索 →'}};
const D=[['대한민국','South Korea','韓国','韩国','서울','Seoul','ソウル','首尔','아시아','Asia','アジア','亚洲','🇰🇷','경복궁'],['일본','Japan','日本','日本','도쿄','Tokyo','東京','东京','아시아','Asia','アジア','亚洲','🇯🇵','후지산'],['프랑스','France','フランス','法国','파리','Paris','パリ','巴黎','유럽','Europe','ヨーロッパ','欧洲','🇫🇷','에펠탑'],['이탈리아','Italy','イタリア','意大利','로마','Rome','ローマ','罗马','유럽','Europe','ヨーロッパ','欧洲','🇮🇹','콜로세움'],['이집트','Egypt','エジプト','埃及','카이로','Cairo','カイロ','开罗','아프리카','Africa','アフリカ','非洲','🇪🇬','피라미드'],['미국','United States','アメリカ','美国','워싱턴 D.C.','Washington D.C.','ワシントンD.C.','华盛顿','북아메리카','North America','北アメリカ','北美洲','🇺🇸','자유의 여신상'],['브라질','Brazil','ブラジル','巴西','브라질리아','Brasília','ブラジリア','巴西利亚','남아메리카','South America','南アメリカ','南美洲','🇧🇷','구세주상'],['호주','Australia','オーストラリア','澳大利亚','캔버라','Canberra','キャンベラ','堪培拉','오세아니아','Oceania','オセアニア','大洋洲','🇦🇺','시드니 오페라 하우스']];
const ix=()=>({ko:0,en:1,ja:2,zh:3}[lang]),t=()=>I[lang],nm=d=>d[ix()],cp=d=>d[4+ix()],ct=d=>d[8+ix()],pick=(a,p)=>shuffle([a,...shuffle(p.filter(x=>x!==a)).slice(0,3)]),save=()=>localStorage.waState=JSON.stringify(state);
function card(id){let d=D[(id*13+5)%D.length],z=id%4,answer=z==0?nm(d):z==1?cp(d):z==2?ct(d):nm(d),pool=z==1?D.map(cp):z==2?D.map(ct):D.map(nm),r=id%29==0?['EPIC','e']:id%7==0?['RARE','r']:['COMMON',''],sym=z==0?d[12]:z==1?'🏛️':z==2?'🗺️':'✨',subject=z==3?d[13]:nm(d);return{id,d,z,answer,pick:pick(answer,pool),r,sym,subject,f:z==3?`${d[13]} · ${nm(d)}`:`${nm(d)} · ${cp(d)}`}}
function hud(){let a=t();$('eye').textContent=a.eye;$('title').textContent=a.title;$('intro').textContent=a.intro;$('lx').textContent=a.xp;$('ls').textContent=a.streak;$('lb').textContent=a.best;$('lc').textContent=a.cards;$('note').textContent=a.note;$('xp').textContent=state.xp.toLocaleString()+' XP';$('streak').textContent=streak;$('best').textContent=state.best.toLocaleString();$('cards').textContent=`${state.cards.length.toLocaleString()} / 10,000`;$('hallTitle').textContent=a.hall;$('share').textContent='↗ '+a.share;$('edit').title=a.edit;document.documentElement.lang=lang;ranking()}
function ranking(){let a=t(),r=state.ranks||[];$('ranking').innerHTML=r.length?r.map((x,i)=>`<div class="rank"><b>${['🥇','🥈','🥉','4.','5.'][i]}</b>${x.name}<span>${x.score} XP</span></div>`).join(''):`<p class="empty">${a.empty}</p>`}
function begin(){rankSaved=false;deck=[];let used=new Set;while(deck.length<RUN){let n=Math.floor(Math.random()*TOTAL)+1;if(!used.has(n)){used.add(n);deck.push(n)}}turn=streak=score=0;render()}
function render(){if(turn===RUN)return finish();locked=false;let a=t(),c=card(deck[turn]),cl=['flag','capital','continent','landmark'];$('game').innerHTML=`<div class="row"><span class="badge">✦ ${RUN}${a.round}</span><span>${a.card} #${String(c.id).padStart(5,'0')} / 10,000</span></div><div class="bar"><i id="bar" style="width:${turn/RUN*100}%"></i></div><article class="quiz"><span class="rare ${c.r[1]}">${c.r[0]}</span><div class="scene ${cl[c.z]}"><span>${c.sym}</span></div><div class="kind">${a.k[c.z]}</div><h2 id="question">${a.q[c.z](c.subject)}</h2></article><div class="choices" id="choices"></div><div id="feedback" class="feedback"></div><div class="actions"><div><button class="hint" id="hint">${a.hint}</button><button class="speak" id="speak">${a.speak}</button></div><button class="next hidden" id="next">${a.next}</button></div>`;shuffle(c.pick).forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<i class="letter">${'ABCD'[i]}</i>${v}`;b.onclick=()=>answer(v,b,c);$('choices').append(b)});$('hint').onclick=()=>{$('feedback').className='feedback';$('feedback').textContent=a.clue(nm(c.d),cp(c.d))};$('speak').onclick=()=>speak(a.q[c.z](c.subject));$('next').onclick=()=>{speechSynthesis.cancel();turn++;render()};hud()}
function speak(text){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(text);u.lang={ko:'ko-KR',en:'en-US',ja:'ja-JP',zh:'zh-CN'}[lang];u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}
function answer(v,b,c){if(locked)return;locked=true;let ok=v===c.answer;document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.textContent.includes(c.answer))x.classList.add('correct')});if(ok){let p=55+streak*10;score+=p;state.xp+=p;streak++;if(!state.cards.includes(c.id))state.cards.push(c.id);$('feedback').className='feedback good';$('feedback').textContent=t().yes(p,c.f)}else{streak=0;b.classList.add('wrong');$('feedback').className='feedback bad';$('feedback').textContent=t().no(c.answer,c.f)}state.best=Math.max(state.best,score);save();$('bar').style.width=`${(turn+1)/RUN*100}%`;$('next').classList.remove('hidden');hud()}
function finish(){if(!rankSaved){state.ranks=[...(state.ranks||[]),{name:player,score,date:Date.now()}].sort((a,b)=>b.score-a.score).slice(0,5);rankSaved=true;save()}$('game').innerHTML=`<div class="end"><div class="medal">${score>850?'🏆':'🌟'}</div><h2>${t().done}</h2><p><b>${player}</b> · +${score} XP</p><button class="next" onclick="begin()">${t().again}</button></div>`;hud()}
function welcome(){let a=t();$('welcomeTitle').textContent=a.welcome;$('welcomeText').textContent=a.welcomeText;$('name').placeholder=a.name;$('enter').textContent=a.enter;$('name').value=player;$('welcome').classList.remove('hidden');$('name').focus()}$('enter').onclick=()=>{let n=$('name').value.trim();if(!n)return $('name').focus();player=n;localStorage.waPlayer=n;$('welcome').classList.add('hidden');begin()};$('name').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};$('edit').onclick=welcome;$('lang').value=lang;$('lang').onchange=e=>{lang=e.target.value;localStorage.waLang=lang;hud();welcome()};$('share').onclick=async()=>{let text=`${player} · WORLD ATLAS ${score||state.best} XP 🏆`;try{if(navigator.share)await navigator.share({title:'World Atlas',text});else{await navigator.clipboard.writeText(text);alert(text)}}catch(e){}};hud();welcome();
</script></body></html>
